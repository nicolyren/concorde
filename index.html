<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concorde — gérer une ville, une région, un pays</title>
  <meta name="description" content="Concorde : jeu de gestion coopératif en tour par tour. Budget, élections, banques, écoles, transports… sans guerre ni concurrence." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="home" class="hidden">
    <div class="home-card">
      <h1>🏛️ Concorde</h1>
      <p class="mute">Jeu de gestion coopérative : commune → région → pays, sans guerre ni concurrence.</p>
      <div class="actions" style="justify-content:flex-start">
        <button id="home-new" class="primary">🆕 Nouvelle partie</button>
        <button id="home-import">📂 Importer une sauvegarde</button>
      </div>
      <h2>Vos parties</h2>
      <div id="home-list"></div>
    </div>
  </div>
  <div id="app" class="hidden">
    <header id="topbar">
      <div class="brand">🏛️ <b>Concorde</b></div>
      <div id="stats"></div>
      <div class="top-actions">
        <button id="btn-next" class="primary" title="Raccourci : Espace">Trimestre suivant ▶</button>
        <button id="btn-pause" title="Mettre en pause et revenir à l’accueil">⏸️ Pause</button>
        <button id="btn-menu" title="Menu">☰</button>
      </div>
    </header>
    <div id="main">
      <aside id="toolbar"></aside>
      <section id="mapwrap">
        <canvas id="map"></canvas>
        <div id="maptools">
          <label>Calque
            <select id="overlay">
              <option value="normal">Carte</option>
              <option value="zones">Plan d’urbanisme</option>
              <option value="districts">Secteurs</option>
              <option value="serve">Desserte routière</option>
              <option value="pollution">Pollution / verdure</option>
            </select>
          </label>
          <button id="btn-center" title="Recentrer sur la mairie">⌖</button>
        </div>
        <div id="tip"></div>
        <div id="tileinfo"></div>
      </section>
      <aside id="side">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </aside>
    </div>
  </div>
  <div id="toast"></div>
  <dialog id="dlg"></dialog>
  <input type="file" id="importfile" accept="application/json" hidden />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
